<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Brindix · Tu bar en el celular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0a12">
  <meta name="description" content="Carta digital, pedidos por mesa, música a pedido y control del bar.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    (function () {
      var c = 'auto';
      try { c = JSON.parse(localStorage.getItem('brindix.theme')) || 'auto'; } catch (e) {}
      var light = c === 'light' || (c === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.setAttribute('data-mode', light ? 'light' : 'dark');
      if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#faf7f2');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
