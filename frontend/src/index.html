<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Brindix · Tu bar en el celular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0d0b">
  <meta name="description" content="Software para bares: carta con QR, rondas en dos toques, caja que cuadra y música a pedido. Funciona en el celular, sin instalar nada.">
  <!-- Vista previa al compartir (WhatsApp, Facebook, Telegram, X). Cada bar tiene la suya (ver nginx.conf). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Brindix">
  <meta property="og:locale" content="es_CO">
  <meta property="og:url" content="https://brindix.cania.app/">
  <meta property="og:title" content="Brindix · Tu bar en el celular de todos">
  <meta property="og:description" content="Carta con QR, rondas en dos toques, caja que cuadra y música a pedido.">
  <meta property="og:image" content="https://brindix.cania.app/og/brindix.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Brindix: la carta de un bar en el celular">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://brindix.cania.app/og/brindix.jpg">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="og/icon-180.jpg">
  <script>
    (function () {
      var c = 'auto';
      try { c = JSON.parse(localStorage.getItem('brindix.theme')) || 'auto'; } catch (e) {}
      var light = c === 'light' || (c === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.setAttribute('data-mode', light ? 'light' : 'dark');
      if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f3f1');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
