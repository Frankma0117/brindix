# Lectores de enlaces (WhatsApp, Facebook, Telegram…) no ejecutan JavaScript: para las páginas de un bar
# reciben una página con la vista previa del bar desde el backend (/api/public/<bar>/share).
map $http_user_agent $link_preview {
    default 0;
    "~*(whatsapp|facebookexternalhit|facebot|twitterbot|telegrambot|slackbot|linkedinbot|discordbot|skypeuripreview|pinterest|vkshare|embedly|iframely)" 1;
}
map "$link_preview:$uri" $share_slug {
    default "";
    "~^1:/(?!plataforma|creditos|ingresar|demo-assets|og/|uploads|api|favicon)(?<s>[a-z0-9-]{3,40})(/.*)?$" $s;
}

# Con nombre de upstream, proxy_pass con variables no necesita resolver DNS.
upstream brindix_backend { server backend:8080; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 14m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        expires 30d;
    }

    # Imágenes de vista previa: cache corto (pueden cambiar de diseño).
    location /og/ {
        expires 1d;
        try_files $uri =404;
    }

    # Archivos con hash: cache largo. index.html: siempre fresco.
    location ~* \.(js|css|woff2?|png|jpg|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Vista previa del bar para los lectores de enlaces.
        if ($share_slug != "") { proxy_pass http://brindix_backend/api/public/$share_slug/share?path=$uri; }
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
