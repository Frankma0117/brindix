# Brindix en el servidor: MySQL + backend (Spring Boot) + frontend (nginx con Angular).
# Uso: bash scripts/init-env.sh && bash scripts/deploy.sh
# Queda en 127.0.0.1:${BRINDIX_PORT:-5710}; el nginx del servidor publica el dominio con HTTPS (scripts/sudo-setup.sh).
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: brindix
      MYSQL_USER: ${DATABASE_USER:-brindix}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?pon DATABASE_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?pon MYSQL_ROOT_PASSWORD en .env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--max-connections=60"]
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:mysql://db:3306/brindix?connectionTimeZone=UTC&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true&useSSL=false
      BRINDIX_UPLOADS_DIR: /data/uploads
      JAVA_OPTS: -Xms128m -Xmx512m -Djava.net.preferIPv4Stack=true
      BRINDIX_STUDIO_URL: http://studio:8000
      BRINDIX_PUBLISHER_URL: http://publisher:3100
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Estudio de videos (tutoriales y publicidad desde /plataforma). Graba la demo real con Chromium y arma el MP4.
  # Va con prioridad baja y límites: el bar y el panel siempre responden primero.
  studio:
    build: ./studio
    restart: unless-stopped
    env_file: .env
    environment:
      BRINDIX_INTERNAL_URL: http://frontend
      STUDIO_VENUE: ${STUDIO_VENUE:-demo}
    cpus: "1.5"
    mem_limit: 2g
    shm_size: 512m
    depends_on:
      - frontend

  # Publicador de redes (YouTube, Instagram, Facebook y TikTok), como sección de /plataforma. Va por la red interna:
  # el nginx del frontend lo publica en /publicador/ y el acceso lo da el ticket del backend (sin otro login).
  # Solo recibe las variables que necesita (no el .env completo). Configurar: bash scripts/set-publisher.sh
  publisher:
    build: ./publisher
    restart: unless-stopped
    environment:
      EMBEDDED: "true"
      BASE_PATH: /publicador
      PORT: "3100"
      PROJECT_NAME: Brindix
      PUBLIC_URL: ${BRINDIX_PUBLIC_URL:-https://brindix.cania.app}
      EMBED_RETURN_URL: ${BRINDIX_PUBLIC_URL:-https://brindix.cania.app}/plataforma
      EMBED_SECRET: ${PUBLISHER_EMBED_SECRET:?corre bash scripts/set-publisher.sh}
      PUBLISHER_API_KEY: ${PUBLISHER_API_KEY:?corre bash scripts/set-publisher.sh}
      PUBLISHER_SECRET: ${PUBLISHER_SECRET:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      FAL_KEY: ${FAL_KEY:-}
      CANIX_URL: ${CANIX_URL:-}
      CANIX_API_KEY: ${CANIX_API_KEY:-}
      CANIX_WEBHOOK_SECRET: ${CANIX_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${PUBLISHER_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${PUBLISHER_GOOGLE_CLIENT_SECRET:-}
      META_APP_ID: ${PUBLISHER_META_APP_ID:-}
      META_APP_SECRET: ${PUBLISHER_META_APP_SECRET:-}
      META_PAGE_ID: ${PUBLISHER_META_PAGE_ID:-}
      TIKTOK_CLIENT_KEY: ${PUBLISHER_TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${PUBLISHER_TIKTOK_CLIENT_SECRET:-}
      YOUTUBE_PRIVACY: ${PUBLISHER_YOUTUBE_PRIVACY:-private}
      TIKTOK_PRIVACY: ${PUBLISHER_TIKTOK_PRIVACY:-SELF_ONLY}
    volumes:
      - publisher-data:/app/data
    cpus: "1.5"
    mem_limit: 2g
    shm_size: 512m

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BRINDIX_PORT:-5710}:80"
    depends_on:
      - backend

volumes:
  mysql:
  uploads:
  publisher-data:
